version = 1

test_patterns = ["tests/**"]
exclude_patterns = ["node_modules/**", "dist/**", "coverage/**"]

[[analyzers]]
name = "javascript"
enabled = true

  # why: 規則単位の調整は .eslintrc.json。代替gateと再評価条件は docs/quality-assurance.md。
  [analyzers.meta]
  environment = ["nodejs"]
  module_system = "es-modules"
  dialect = "typescript"

[[analyzers]]
name = "docker"
enabled = true

[[analyzers]]
name = "shell"
enabled = true

  [analyzers.meta]
  dialect = "bash"
