name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

env:
  MOMO_DB_REF: 87d18c6159e6cb046d6bdc13e9802cc0d93df8a1
  MOMO_CANONICAL_DB_REF: 2559053f0684c60d344296f3171ca792f4e8e763

jobs:
  canonical-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: summit
          POSTGRES_PASSWORD: summit
          POSTGRES_DB: summit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U summit"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://summit:summit@localhost:5432/summit
      SUMMIT_TEST_CANONICAL_SCHEMA: "1"
    steps:
      - name: Checkout summit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: summit
      - name: Checkout canonical momo-db candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ponta2git/momo-db
          ref: ${{ env.MOMO_CANONICAL_DB_REF }}
          path: momo-db
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: summit/package.json
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: summit/pnpm-lock.yaml
      - name: Build canonical public database types
        run: pnpm install --frozen-lockfile && pnpm build
        working-directory: momo-db
      - name: Install summit dependencies
        run: pnpm install --frozen-lockfile
        working-directory: summit
      - name: Typecheck canonical consumer and verification tools
        run: pnpm exec tsc --noEmit -p tsconfig.canonical.json
        working-directory: summit
      - name: Build with canonical database types
        run: pnpm build
        working-directory: summit
      - name: Verify repositories against every canonical migration
        run: pnpm test:integration tests/integration/canonicalIdentities.contract.test.ts
        working-directory: summit
      - name: Build canonical production image
        run: docker build --file summit/Dockerfile --tag summit-canonical-runtime-check .
      - name: Verify isolated canonical runtime
        run: pnpm verify:runtime-image summit-canonical-runtime-check
        working-directory: summit
      - name: Verify canonical notification capacity
        run: pnpm verify:notification-capacity summit-canonical-runtime-check
        working-directory: summit

  static-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout summit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: summit

      - name: Checkout momo-db
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ponta2git/momo-db
          ref: ${{ env.MOMO_DB_REF }}
          path: momo-db

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          package_json_file: summit/package.json

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: summit/pnpm-lock.yaml

      - name: Install momo-db deps & build
        run: pnpm install --frozen-lockfile && pnpm build
        working-directory: momo-db

      - name: Install summit deps
        run: pnpm install --frozen-lockfile
        working-directory: summit

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Typecheck
        run: pnpm typecheck
        working-directory: summit

      - name: Lint
        run: pnpm lint
        working-directory: summit

      - name: Knip
        run: pnpm lint:knip
        working-directory: summit

      - name: Test
        run: pnpm test
        working-directory: summit

      - name: Build
        run: pnpm build
        working-directory: summit

      - name: Documentation topology
        run: pnpm verify:docs
        working-directory: summit

      - name: Forbidden patterns
        run: pnpm verify:forbidden
        working-directory: summit

      - name: File size advisory
        run: pnpm verify:file-size
        working-directory: summit

  runtime-image:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: summit
          POSTGRES_PASSWORD: summit
          POSTGRES_DB: summit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U summit"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://summit:summit@localhost:5432/summit
    steps:
      - name: Checkout summit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: summit
      - name: Checkout momo-db
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ponta2git/momo-db
          ref: ${{ env.MOMO_DB_REF }}
          path: momo-db
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          package_json_file: summit/package.json
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: summit/pnpm-lock.yaml
      - name: Install verification schema dependencies
        run: pnpm install --frozen-lockfile && pnpm build
        working-directory: momo-db
      - name: Install verification dependencies
        run: pnpm install --frozen-lockfile
        working-directory: summit
      - name: Build production image
        run: docker build --file summit/Dockerfile --tag summit-runtime-check .
      - name: Verify isolated runtime
        run: node summit/scripts/verify/runtimeImage.ts summit-runtime-check
      - name: Verify notification capacity at 256 MiB with 192 MiB target
        run: pnpm verify:notification-capacity summit-runtime-check
        working-directory: summit

  integration-db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: summit
          POSTGRES_PASSWORD: summit
          POSTGRES_DB: summit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U summit"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://summit:summit@localhost:5432/summit
    steps:
      - name: Checkout summit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: summit

      - name: Checkout momo-db
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ponta2git/momo-db
          ref: ${{ env.MOMO_DB_REF }}
          path: momo-db

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          package_json_file: summit/package.json

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: summit/pnpm-lock.yaml

      - name: Install momo-db deps & build
        run: pnpm install --frozen-lockfile && pnpm build
        working-directory: momo-db

      - name: Install summit deps
        run: pnpm install --frozen-lockfile
        working-directory: summit

      - name: Integration tests
        run: pnpm test:integration
        working-directory: summit

  ci:
    name: CI
    if: ${{ always() }}
    needs: [canonical-database, static-baseline, runtime-image, integration-db]
    runs-on: ubuntu-latest
    steps:
      - name: Require every quality job to succeed
        env:
          QUALITY_JOBS_SUCCEEDED: ${{ needs.canonical-database.result == 'success' && needs.static-baseline.result == 'success' && needs.runtime-image.result == 'success' && needs.integration-db.result == 'success' }}
        run: test "$QUALITY_JOBS_SUCCEEDED" = true
