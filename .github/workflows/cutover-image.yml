name: Publish cutover image

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact master SHA whose CI passed
        required: true

permissions:
  contents: read
  actions: read

env:
  MOMO_DB_REF: 2559053f0684c60d344296f3171ca792f4e8e763

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-image-publish
    concurrency:
      group: summit-image-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: summit
          persist-credentials: false
      - name: Bind successful quality gates to this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/master
          test "$GITHUB_SHA" = "$CANDIDATE"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq .object.sha)" = "$CANDIDATE"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$CANDIDATE&event=push&status=success" > quality.json
          jq -e --arg sha "$CANDIDATE" 'any(.workflow_runs[]; .head_sha == $sha and .head_branch == "master" and .conclusion == "success")' quality.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ponta2git/momo-db
          ref: ${{ env.MOMO_DB_REF }}
          path: momo-db
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          package_json_file: summit/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.x
      - name: Build fixed AMD64 candidate
        run: docker build --platform linux/amd64 --provenance=false --file summit/Dockerfile --tag summit-cutover-check .
      - name: Verify non-root runtime dependency closure
        run: node summit/scripts/verify/runtimeImage.ts summit-cutover-check
      - name: Scan exact candidate before publication
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: summit-cutover-check
          version: v0.73.0
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Publish without deploying or starting a Machine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          ref="registry.fly.io/summit-momotetsu:cutover-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          flyctl auth docker
          docker tag summit-cutover-check "$ref"
          docker push "$ref"
          docker buildx imagetools inspect "$ref" --raw > manifest.json
          digest="$(docker image inspect "$ref" --format '{{index .RepoDigests 0}}' | cut -d@ -f2)"
          if jq -e 'has("manifests")' manifest.json >/dev/null; then
            digest="$(jq -er '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")] | if length == 1 then .[0].digest else error("ambiguous platform") end' manifest.json)"
          fi
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          jq -n --arg image "registry.fly.io/summit-momotetsu@$digest" --arg sha "$GITHUB_SHA" \
            --arg db "$MOMO_DB_REF" --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" \
            '{formatVersion:1,registryRef:$image,candidate:$sha,dbRef:$db,producerRun:$run,producerAttempt:$attempt}' > publication.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: summit-cutover-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: publication.json
          retention-days: 30
