name: Cutover Summit

on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [state, stop, stage, observe, verify, resume, restore-source]
        required: true
      candidate_sha:
        required: true
      producer_run_id:
        required: true
      producer_attempt:
        required: true
      plan_sha256:
        description: SHA256 of approved private CUTOVER_SUMMIT_PLAN
        required: true
      confirmation:
        description: Enter action-summit-candidate_sha
        required: true

permissions:
  contents: read
  actions: read

jobs:
  operate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency:
      group: summit-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify candidate, approved operation and publication
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ inputs.candidate_sha }}
          PRODUCER: ${{ inputs.producer_run_id }}
          ATTEMPT: ${{ inputs.producer_attempt }}
          OPERATION: ${{ inputs.action }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/master
          test "$GITHUB_SHA" = "$CANDIDATE"
          test "$CONFIRMATION" = "$OPERATION-summit-$CANDIDATE"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq .object.sha)" = "$CANDIDATE"
          test "$(gh api "repos/$GITHUB_REPOSITORY/contents/deploy/production-mode.json?ref=master" --jq .content | base64 --decode | jq -er .mode)" = cutover
          [[ "$PRODUCER" =~ ^[0-9]+$ && "$ATTEMPT" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER/attempts/$ATTEMPT" > producer.json
          jq -e --arg sha "$CANDIDATE" '.head_sha == $sha and .conclusion == "success" and .path == ".github/workflows/cutover-image.yml" and .event == "workflow_dispatch"' producer.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.producer_run_id }}
          name: summit-cutover-publication-${{ inputs.producer_run_id }}-${{ inputs.producer_attempt }}
          path: publication
      - name: Bind private plan to published platform digest
        env:
          PLAN: ${{ secrets.CUTOVER_SUMMIT_PLAN }}
          EXPECTED_HASH: ${{ inputs.plan_sha256 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$PLAN" > "$RUNNER_TEMP/plan.json"
          [[ "$EXPECTED_HASH" =~ ^[0-9a-f]{64}$ ]]
          test "$(sha256sum "$RUNNER_TEMP/plan.json" | cut -d' ' -f1)" = "$EXPECTED_HASH"
          image="$(jq -er .registryRef publication/publication.json)"
          jq -e --arg image "$image" '.consumer == "summit" and .app == "summit-momotetsu" and .maintenanceConfig.image == $image and .activeConfig.image == $image' "$RUNNER_TEMP/plan.json" >/dev/null
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Operate one fixed Machine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ inputs.candidate_sha }}
          OPERATION: ${{ inputs.action }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq .object.sha)" = "$CANDIDATE"
          test "$(gh api "repos/$GITHUB_REPOSITORY/contents/deploy/production-mode.json?ref=master" --jq .content | base64 --decode | jq -er .mode)" = cutover
          python3 scripts/ops/cutover-machine.py "$OPERATION" --plan "$RUNNER_TEMP/plan.json" --output "$RUNNER_TEMP/evidence.json"
      - name: Encrypt private evidence
        if: always()
        env:
          RECIPIENT: ${{ vars.CUTOVER_EVIDENCE_RECIPIENT }}
        run: |
          set -euo pipefail
          if test -f "$RUNNER_TEMP/evidence.json"; then
            test -n "$RECIPIENT"
            sudo apt-get update -qq
            sudo apt-get install -y age
            age -r "$RECIPIENT" -o evidence.age "$RUNNER_TEMP/evidence.json"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: summit-cutover-${{ inputs.action }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence.age
          if-no-files-found: ignore
          retention-days: 30
